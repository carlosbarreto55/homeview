name: HomeView

options:
  bundleIdPrefix: com.carloseduardo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sign to run locally: ad-hoc signature, no team, not sandboxed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO

packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: 2.3.4

targets:
  HomeView:
    type: application
    platform: macOS
    sources:
      - path: HomeView
    dependencies:
      - package: KSPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carloseduardo.HomeView
        PRODUCT_NAME: HomeView
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HomeView
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: O HomeView precisa acessar a rede local para mostrar as câmeras do seu DVR.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # FFmpegKit ships its macOS libraries as static archives inside
        # iOS-style (shallow) frameworks. Xcode embeds them anyway and then
        # rejects the layout; they hold no code needed at run time.
        SKIP_EMBEDDED_FRAMEWORKS_VALIDATION: YES

  HomeViewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HomeViewTests
    dependencies:
      - target: HomeView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carloseduardo.HomeViewTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HomeView.app/Contents/MacOS/HomeView"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  HomeView:
    build:
      targets:
        HomeView: all
        HomeViewTests: [test]
    test:
      targets:
        - HomeViewTests
    run:
      config: Debug
